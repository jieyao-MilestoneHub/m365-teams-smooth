name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Local pre-PR gate (`make check`) reproduced in CI: lint, type-check, tests.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # uv provisions the interpreter pinned by requires-python (>=3.11).
      - name: Install dependencies
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check
      - name: Type-check (mypy)
        run: uv run mypy
      - name: Test (pytest)
        run: uv run pytest
