name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Local pre-PR gate (`make check`) reproduced in CI: lint, type-check, tests.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # uv provisions the interpreter pinned by requires-python (>=3.11).
      - name: Install dependencies
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check
      - name: Type-check (mypy)
        run: uv run mypy
      - name: Test (pytest, coverage gate ≥80%)
        run: uv run pytest --cov=app

  # The tenant-free Playground bot (reuses the backend in-process); same lint/type/test gate.
  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m365/playground-bot
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # The bot deliberately does not commit a lockfile; key the cache on its manifest.
          cache-dependency-glob: m365/playground-bot/pyproject.toml
      - name: Install dependencies
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check
      - name: Type-check (mypy)
        run: uv run mypy
      - name: Test (pytest)
        run: uv run pytest
