name: Security scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Basic secret scan — fail the build if credentials or tokens are committed.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
