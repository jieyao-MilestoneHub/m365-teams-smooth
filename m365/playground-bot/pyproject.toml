[project]
name = "change-court-playground-bot"
version = "0.1.0"
description = "Thin Bot Framework surface that renders the Change Court card in the Microsoft 365 Agents Playground."
requires-python = ">=3.11"
dependencies = [
    # The court engine is reused in-process (no business logic lives here). These mirror
    # backend/pyproject.toml's runtime dependencies plus httpx — importing app.container pulls in
    # the GitHub adapter, which imports httpx at module load. Keep in sync with the backend.
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "azure-search-documents==12.1.0b1",
    "azure-identity>=1.17",
    "openai>=1.40",
    "httpx>=0.27",
    # The bot surface itself.
    "botbuilder-core>=4.15,<5",
    "botbuilder-integration-aiohttp>=4.15,<5",
    "aiohttp>=3.9",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

# An application, not a distributable library: uv only provisions the virtualenv.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["courtbot", "tests"]

# The court engine and the Bot Framework SDK are treated as untyped boundaries: the engine is the
# backend's well-typed package reached over sys.path, and the SDK ships partial type info. The bot's
# own mapping logic stays under full strict checking.
[[tool.mypy.overrides]]
module = ["app.*", "botbuilder.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
