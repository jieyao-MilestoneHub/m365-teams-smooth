# Example rule-pack file. Point POLICY_PACKS_PATH at a file like this to extend the court's
# governance with your own scenarios — see docs/extending.md for the field-by-field walkthrough.
# File packs APPEND to the built-in defaults (which keep first-match precedence); set
# include_defaults: false to replace them entirely.
include_defaults: true
packs:
  - id: dns_change
    match:
      any_action_capability: ["dns.update_record"]
      any_tag: ["dns.production_zone"]
    subjects: ["dns-change"]
    grounding_query: "DNS change production zone rollback window"
    risk_factors:
      - id: production_zone
        when_tag: dns.production_zone
        severity: high
        marks_unsafe: true
      - id: long_ttl
        when_tag: dns.long_ttl
        severity: low
    quorum:
      approvers:
        - { role: eng_lead, when_tag: dns.production_zone }
      policy: all
    verdict_options:
      default: [approve, request_revision, reject]
      when_unsafe: [accept_alternative, request_revision, reject]
