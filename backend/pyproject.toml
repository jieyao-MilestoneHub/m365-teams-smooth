[project]
name = "ai-change-court"
version = "0.1.0"
description = "Governed execution for risky enterprise decisions in Microsoft Teams."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    # Pinned to the major to isolate the verdict-interrupt API; all graph calls live in agent/.
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "mcp>=1.2",
    "pyjwt>=2.8",
    "alembic>=1.13",
    # Knowledge grounding (Foundry IQ over Azure AI Search). Beta pin: the agentic-retrieval
    # KnowledgeBaseRetrievalClient lives in this preview. Only used when the real provider is configured.
    "azure-search-documents==12.1.0b1",
    "azure-identity>=1.17",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "respx>=0.21",
]

# This is an application, not a distributable library: tell uv not to build/install
# the project root, so `uv sync` only provisions dependencies into the virtualenv.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

# The graph engine's public types are partial; confine the relaxation to its imports so the
# domain, ports, services, and nodes stay under full strict checking.
[[tool.mypy.overrides]]
module = ["langgraph.*", "langgraph_checkpoint_sqlite.*"]
ignore_missing_imports = true

# The Azure SDK ships only partial type information; relax its imports the same way.
[[tool.mypy.overrides]]
module = ["azure.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
